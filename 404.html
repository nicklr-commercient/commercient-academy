<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Commercient Academy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/commercient-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--teal:#29ABE2;--charcoal:#3D3D3D;--navy:#1B3A5C;--cloud:#E8EEF4;--line:#dbe4ec;--muted:#6a7886}
  *{box-sizing:border-box} body{margin:0;font-family:'Open Sans',sans-serif;background:var(--cloud);color:var(--charcoal);line-height:1.6}
  .top{display:flex;align-items:center;gap:14px;height:64px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
  .top img{height:34px}
  .top .t{font-family:'Raleway';font-weight:700;letter-spacing:.13em;font-size:12.5px;text-transform:uppercase;border-left:1px solid var(--line);padding-left:14px}
  .wrap{max-width:560px;margin:64px auto;padding:0 20px;text-align:center}
  .charlie{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid #B8D4E4;background:#dceaf4;margin-bottom:18px}
  h1{font-family:'Raleway';font-weight:800;font-size:30px;margin:0 0 10px;color:var(--navy)}
  p{color:#52606d;margin:0 0 26px}
  .cta{display:inline-block;background:var(--teal);color:#fff;font-family:'Raleway';font-weight:700;letter-spacing:.04em;padding:12px 26px;border-radius:9px;font-size:14px;text-decoration:none}
  .cta:hover{background:#1f93c6}
  .alt{display:block;margin-top:16px;font-size:14px}
  .alt a{color:var(--teal);text-decoration:none}
  .alt a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="top">
    <img src="assets/commercient-logo.png" alt="Commercient">
    <span class="t">Academy</span>
  </div>
  <div class="wrap">
    <img class="charlie" src="assets/charlie.png" alt="Charlie" onerror="this.style.display='none'">
    <h1>Hmm — that page isn't in my knowledge base.</h1>
    <p>I checked twice. Whatever was here has moved, or the link took a wrong turn. Let's get you back on the path to a badge.</p>
    <a class="cta" href="/">Back to the Academy &rarr;</a>
    <span class="alt">Looking to check a credential? <a href="/verify.html">Verify it here</a>.</span>
  </div>
</body>
</html>
