<style>
/* Commercient Partner Academy — styles
   Brand: Teal #29ABE2, Charcoal #3D3D3D, Navy #1B3A5C, Cloud #E8EEF4 */
@import url('https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap');

:root{
  --teal:#29ABE2; --charcoal:#3D3D3D; --white:#fff;
  --steel:#4A7FA5; --medblue:#7BA7C8; --pale:#B8D4E4;
  --cloud:#E8EEF4; --navy:#1B3A5C;
  --line:#dbe4ec; --muted:#6a7886;
  --shadow:0 1px 3px rgba(27,58,92,.08),0 4px 16px rgba(27,58,92,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Open Sans',-apple-system,Segoe UI,sans-serif;color:var(--charcoal);background:var(--cloud);font-size:16px;line-height:1.6}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:'Raleway',sans-serif;color:var(--charcoal);line-height:1.25}

/* ---------- Top nav ---------- */
.topnav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:28px;height:64px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
.topnav .brand{display:flex;align-items:center;gap:14px}
.topnav .brand img{height:34px;display:block}
.topnav .brand .div{width:1px;height:26px;background:var(--line)}
.topnav .brand .acad{font-family:'Raleway';font-weight:700;letter-spacing:.13em;font-size:12.5px;color:var(--charcoal);text-transform:uppercase}
.topnav nav{margin-left:auto;display:flex;gap:30px;align-items:center}
.topnav nav a{font-family:'Raleway';font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--charcoal)}
.topnav nav a:hover{color:var(--teal);text-decoration:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Raleway'}

/* ---------- Layout ---------- */
.shell{display:flex;align-items:flex-start;max-width:1920px;margin:0 auto}
.sidebar{position:sticky;top:64px;align-self:flex-start;width:300px;min-width:300px;height:calc(100vh - 64px);overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:28px 22px}
.main{flex:1;min-width:0;padding:34px 46px 80px}
.page{max-width:1080px;margin:0 auto}

/* ---------- Sidebar ---------- */
.sb-title{font-family:'Raleway';font-weight:800;font-size:19px;line-height:1.2;margin:0 0 16px}
.sb-overview{display:inline-flex;align-items:center;gap:8px;font-family:'Raleway';font-weight:600;font-size:13px;color:var(--teal);cursor:pointer;text-transform:none;letter-spacing:0}
.sb-overview:hover{text-decoration:underline}
.sb-progress{margin:16px 0 6px}
.sb-bar{height:5px;border-radius:4px;background:var(--cloud);overflow:hidden}
.sb-bar > i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s ease}
.sb-count{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
.sb-group{margin-top:22px}
.sb-group > h4{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--steel);font-weight:700;margin:0 0 8px}
.sb-item{display:flex;align-items:flex-start;gap:11px;padding:8px 10px;margin:1px -10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--charcoal)}
.sb-item:hover{background:var(--cloud)}
.sb-item.active{background:#e7f4fb;color:#13628a;font-weight:600}
.sb-item .dot{flex:none;width:17px;height:17px;border-radius:50%;border:2px solid var(--medblue);margin-top:2px;position:relative;background:#fff}
.sb-item.done .dot{background:var(--teal);border-color:var(--teal)}
.sb-item.done .dot::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* ---------- Hero ---------- */
.hero{border-radius:16px;padding:46px 48px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,#1B3A5C 0%,#23507b 55%,#2f6ea0 100%)}
.hero .circle{position:absolute;right:-40px;top:-50px;width:300px;height:300px;border-radius:50%;background:rgba(123,167,200,.22)}
.hero .eyebrow{font-family:'Raleway';font-weight:700;letter-spacing:.18em;font-size:12px;text-transform:uppercase;color:#bcd6ea;margin:0 0 14px}
.hero h1{color:#fff;font-weight:800;font-size:42px;margin:0 0 16px;letter-spacing:.01em}
.hero p{max-width:78%;color:#dceaf4;font-size:16px;margin:0}
.hero.sm{padding:34px 40px}
.hero.sm h1{font-size:30px;margin-bottom:8px}
.hero .est{display:inline-block;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:30px;font-size:12.5px;font-weight:600;color:#fff}

/* ---------- Cards / sections ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.course-card{display:flex;gap:22px;align-items:flex-start;padding:28px 30px;margin-top:24px}
.course-card .mark{width:54px;height:54px;flex:none}
.course-card h3{margin:2px 0 8px;font-size:19px;font-weight:700}
.course-card p{margin:0;color:#52606d}
.cta{display:inline-block;margin-top:16px;background:var(--teal);color:#fff;font-family:'Raleway';font-weight:700;letter-spacing:.04em;padding:12px 26px;border-radius:9px;border:none;cursor:pointer;font-size:14px}
.cta:hover{background:#1f93c6;text-decoration:none}
.cta.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal);padding:10px 24px}
.cta.ghost:hover{background:#eaf6fc}

section.block{margin-top:40px}
section.block > h2{font-size:24px;font-weight:700;margin:0 0 8px}
section.block > .lead{color:#52606d;margin:0 0 18px}

.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.rm-card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--teal);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.rm-card .step{font-family:'Raleway';font-weight:700;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.rm-card h4{margin:8px 0 6px;font-size:16px}
.rm-card p{margin:0;color:#5a6772;font-size:14px}

.learn-list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.learn-list .li{display:flex;gap:12px;padding:13px 12px;border-bottom:1px solid var(--cloud)}
.learn-list .li:last-child{border-bottom:none}
.learn-list .li .ck{flex:none;width:22px;height:22px;border-radius:50%;background:#e7f4fb;color:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}

.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--steel);border-radius:10px;padding:18px 22px;margin-top:18px;color:#42505c}
.note h4{margin:0 0 6px;font-size:15px;color:var(--navy)}

/* ---------- Module reader ---------- */
.reader{max-width:1080px;margin:0 auto}
.reader .meta{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chip{background:#e7f4fb;color:#13628a;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:20px;font-family:'Raleway'}
.obj{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 24px;margin:22px 0;box-shadow:var(--shadow)}
.obj h4{margin:0 0 10px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.obj ul{margin:0;padding-left:20px}
.reader-body{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 34px;box-shadow:var(--shadow)}
.reader-body h3{font-size:18px;margin:26px 0 10px;color:var(--navy)}
.reader-body h3:first-child{margin-top:0}
.reader-body p{margin:0 0 14px}
.reader-body ul{margin:0 0 16px;padding-left:22px}
.reader-body li{margin:5px 0}
.reader-body .flow{background:var(--cloud);border-radius:8px;padding:12px 16px;font-weight:600;color:var(--navy);text-align:center;letter-spacing:.02em}
.reader-body h4.step-h{font-family:'Raleway';font-size:15px;color:#13628a;background:#eef6fb;border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:9px 14px;margin:22px 0 10px}
.callout{background:#f3f9fd;border:1px solid #d4e8f5;border-left:4px solid var(--teal);border-radius:10px;padding:16px 20px;margin:18px 0}
.callout h4{margin:0 0 6px;font-size:14px;color:var(--navy);text-transform:none;letter-spacing:0}
.callout p{margin:0;color:#42505c}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:8px 0 4px}
.col-card{border-radius:12px;padding:16px 20px}
.col-card.is{background:#eef8f1;border:1px solid #cfe9d8}
.col-card.isnt{background:#fdf0ef;border:1px solid #f3d5d2}
.col-card h4{margin:0 0 8px;font-size:14px}
.col-card.is h4{color:#1f7a45}.col-card.isnt h4{color:#b23b32}
.col-card ul{padding-left:18px;font-size:14px}
.data-table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:14px}
.data-table th{background:var(--navy);color:#fff;text-align:left;padding:10px 12px;font-family:'Raleway';font-weight:600}
.data-table td{border:1px solid var(--line);padding:9px 12px;vertical-align:top}
.data-table tr:nth-child(even) td{background:#f7fafc}
.takeaways{background:#eef6fb;border:1px solid #d4e8f5;border-radius:12px;padding:20px 24px;margin-top:22px}
.takeaways h4{margin:0 0 10px;color:var(--navy);font-size:15px}
.takeaways ul{margin:0;padding-left:20px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}
.pager .spacer{flex:1}

/* ---------- Quiz ---------- */
.quiz-intro{max-width:860px}
.q-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin:16px 0;box-shadow:var(--shadow)}
.q-block .qn{font-weight:700;font-family:'Raleway';color:var(--navy);margin:0 0 14px;font-size:16px}
.q-block .qn span{color:var(--teal);margin-right:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 15px;border:1.5px solid var(--line);border-radius:9px;margin:8px 0;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--medblue);background:#f7fbfe}
.opt input{margin-top:3px}
.opt.correct{border-color:#3fae6a;background:#eef8f1}
.opt.wrong{border-color:#d9534f;background:#fdf0ef}
.qsec-head{font-family:'Raleway';font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.1em;font-size:13px;margin:34px 0 4px;border-bottom:2px solid var(--line);padding-bottom:8px}
.scorebar{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 22px;margin-top:24px;display:flex;align-items:center;gap:18px;box-shadow:0 -2px 14px rgba(27,58,92,.08)}
.scorebar .res{font-weight:700;font-family:'Raleway';font-size:16px}
.scorebar .res.pass{color:#1f7a45}.scorebar .res.fail{color:#b23b32}

/* ---------- Certificate ---------- */
.cert-wrap{max-width:900px;margin:0 auto}
.certificate{background:#fff;border:3px solid var(--teal);border-radius:14px;padding:46px 56px;text-align:center;position:relative;box-shadow:var(--shadow)}
.certificate::before{content:"";position:absolute;inset:10px;border:1px solid var(--pale);border-radius:8px;pointer-events:none}
.certificate img{height:46px;margin-bottom:18px}
.certificate .ttl{font-family:'Raleway';font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--steel)}
.certificate h2{font-size:30px;margin:10px 0 6px;color:var(--navy)}
.certificate .name{font-family:'Raleway';font-weight:800;font-size:26px;color:var(--teal);margin:18px 0;border-bottom:2px solid var(--cloud);display:inline-block;padding:0 30px 8px}
.certificate .body{color:#52606d;max-width:560px;margin:0 auto}
.certificate .row{display:flex;justify-content:space-between;margin-top:40px;font-size:13px;color:var(--muted)}
.cert-input{padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;min-width:280px}
/* registration form */
.regform{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 28px;box-shadow:var(--shadow);max-width:640px}
.field-row{display:flex;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;flex:1}
.field span{font-family:'Raleway';font-weight:600;font-size:13px;color:var(--navy)}
.field input{padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit;width:100%}
.field input:focus{outline:none;border-color:var(--teal)}
.form-err{color:#b23b32;font-size:14px;margin:0 0 14px;font-weight:600}
/* certificate meta + banner */
.cert-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;max-width:620px;margin:30px auto 0;text-align:left}
.cert-meta > div{font-size:14px;color:var(--charcoal);border-bottom:1px solid var(--cloud);padding-bottom:8px}
.cert-meta span{display:block;font-family:'Raleway';font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);margin-bottom:2px}
.email-banner{background:#eef8f1;border:1px solid #cfe9d8;border-left:4px solid #3fae6a;border-radius:10px;padding:14px 18px;margin-bottom:18px;color:#1f5e3a;font-size:14px}
.hide{display:none!important}

/* ---------- Sidebar: academy/catalog mode ---------- */
.sb-tag{font-size:12px;color:var(--muted);margin:-8px 0 6px}
.sb-crumb{font-family:'Raleway';font-weight:600;font-size:12px;color:var(--teal);cursor:pointer;margin-bottom:14px;display:inline-block}
.sb-crumb:hover{text-decoration:underline}
.sb-item .soon-tag{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9aa7b3;background:var(--cloud);padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle}
.sb-item .pct{font-style:normal;font-size:11px;font-weight:700;color:var(--teal);margin-left:6px}

/* ---------- Home hero ---------- */
.home-hero h1{font-size:46px;max-width:14ch}
.home-hero p{max-width:62ch}
.hero-cta{margin-top:24px;background:#fff;color:var(--navy)}
.hero-cta:hover{background:#eaf6fc}

/* ---------- Who is this for ---------- */
.aud-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.aud-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 16px;box-shadow:var(--shadow)}
.aud-card .aud-ic{font-size:26px;line-height:1;margin-bottom:10px}
.aud-card h4{margin:0 0 6px;font-size:15px}
.aud-card p{margin:0;font-size:13px;color:#5a6772}

/* ---------- Money band + money callout ---------- */
.money-band{background:linear-gradient(120deg,#0f5132 0%,#198754 100%);border-radius:14px;padding:30px 34px;color:#fff;box-shadow:var(--shadow)}
.money-band h2{color:#fff;margin:0 0 8px}
.money-band p{margin:0;color:#dcf3e6;max-width:80ch}
.callout.money{background:#f0faf4;border-color:#cdeada;border-left-color:#2e9e63}
.callout.money strong{color:#176c41;font-weight:600;display:block}

/* ---------- Course catalog ---------- */
.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.course-tile{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 22px;box-shadow:var(--shadow)}
.course-tile.soon{opacity:.92;background:#fbfcfd}
.tile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tile-mark{width:42px;height:42px}
.tile-tag{font-family:'Raleway';font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9aa7b3;background:var(--cloud);padding:4px 10px;border-radius:20px}
.tile-badge{font-family:'Raleway';font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#1f7a45;background:#eef8f1;border:1px solid #cfe9d8;padding:4px 10px;border-radius:20px}
.course-tile h3{margin:0 0 6px;font-size:18px}
.tile-aud{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--steel)}
.tile-desc{margin:0 0 14px;font-size:14px;color:#52606d;flex:0 0 auto}
.tile-money{margin:0 0 14px}
.tile-money strong{font-size:13px}
.tile-bar{height:5px;border-radius:4px;background:var(--cloud);overflow:hidden;margin-bottom:14px}
.tile-bar > i{display:block;height:100%;background:var(--teal)}
.tile-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.tile-time{font-size:12px;font-weight:600;color:var(--muted)}
.tile-foot .cta{margin-top:0}
.tile-soon{font-family:'Raleway';font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9aa7b3}

/* ---------- Badges ---------- */
.badge{display:inline-flex;flex-direction:column;align-items:center;text-align:center;gap:6px;width:140px}
.badge .badge-disc{position:relative;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#3fc0f0,#1b6fa0);box-shadow:0 6px 16px rgba(27,58,92,.25)}
.badge.locked .badge-disc{background:radial-gradient(circle at 35% 30%,#c4d2dd,#8ea2b2)}
.badge .badge-ring{position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.7);border-radius:50%}
.badge .badge-ic{font-size:34px}
.badge .badge-name{font-family:'Raleway';font-weight:800;font-size:14px;color:var(--navy)}
.badge .badge-sub{font-size:11px;color:var(--muted);letter-spacing:.04em}
.badge.lg{width:170px}
.badge.lg .badge-disc{width:108px;height:108px}
.badge.lg .badge-ic{font-size:46px}
.badge.lg .badge-name{font-size:16px}
.badge.sm{width:120px}
.badge.sm .badge-disc{width:66px;height:66px}
.badge.sm .badge-ic{font-size:28px}
.badge-strip{display:flex;flex-wrap:wrap;gap:24px}
.badge-link{cursor:pointer;border-radius:12px;padding:8px;transition:.15s}
.badge-link:hover{background:#fff;box-shadow:var(--shadow)}

/* ---------- Achievement / share ---------- */
.achieve{display:flex;gap:28px;align-items:center;background:linear-gradient(120deg,#1B3A5C,#2f6ea0);border-radius:16px;padding:30px 34px;color:#fff;margin-bottom:22px}
.achieve .badge .badge-name,.achieve .badge .badge-sub{color:#fff}
.achieve-copy{flex:1}
.achieve-copy .eyebrow{font-family:'Raleway';font-weight:700;letter-spacing:.18em;font-size:11px;text-transform:uppercase;color:#bcd6ea;margin:0 0 8px}
.achieve-copy h2{color:#fff;margin:0 0 8px;font-size:26px}
.achieve-copy p{margin:0;color:#dceaf4;max-width:62ch}
.share-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.share-li{background:#0a66c2}
.share-li:hover{background:#08528f}
.achieve .cta.ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.achieve .cta.ghost:hover{background:rgba(255,255,255,.12)}
.copy-note{display:inline-block;margin-top:10px;font-size:13px;color:#c7f0d6}

@media print{.topnav,.sidebar,.no-print{display:none!important}.main{padding:0}.shell{display:block}}
@media (max-width:1180px){.aud-grid{grid-template-columns:repeat(3,1fr)}.catalog{grid-template-columns:repeat(2,1fr)}}
@media (max-width:1080px){.roadmap{grid-template-columns:1fr 1fr}.two-col{grid-template-columns:1fr}}
@media (max-width:820px){.sidebar{display:none}.roadmap{grid-template-columns:1fr}.main{padding:24px}.aud-grid{grid-template-columns:1fr 1fr}.catalog{grid-template-columns:1fr}.achieve{flex-direction:column;text-align:center}.home-hero h1{font-size:34px}}

</style>
</head>

const MODULES = [
  {
    id: 1, group: "Platform & Selling",
    title: "How Commercient prices and sells integration",
    time: "12 min",
    objectives: [
      "Understand the Commercient platform umbrella and the three product lines underneath it",
      "Know the three components and three figures on every Commercient quote",
      "Identify the six variables that move price, and where partners can and can't quote numbers"
    ],
    body: `
      <p>Commercient is a platform, not a single product. Underneath the platform umbrella sit three product lines — <strong>SYNC integration, AI agentic solutions, and Pulse automations</strong> — and all three are powered by the same data lake that Sync builds for every customer. A customer who is already integrated has the foundation in place for AI and Pulse with no additional integration work. That's the moat.</p>
      <p>The practical implication for partners: a deal that used to be "let's get them on Sync" is now "let's get them on the Commercient platform, starting with Sync." Once they're on the platform, the same conversation continues into AI and Pulse — same customer, multiple expansions, same data layer.</p>
      <h3>The three components, three figures on every SYNC quote</h3>
      <p>Every Commercient integration quote breaks down into three components: technology, initial setup, and ongoing success plan. These show up on the quote as three figures the customer reviews:</p>
      <ul>
        <li><strong>Annual Success Plan</strong> — the support / managed-service component, billed yearly</li>
        <li><strong>Monthly SaaS</strong> — the platform / integration subscription</li>
        <li><strong>Success Plan</strong> — the project setup / onboarding amount, one-time at delivery</li>
      </ul>
      <h3>The six variables that move the price</h3>
      <ul>
        <li>Systems being connected</li>
        <li>Number of ERP instances or databases</li>
        <li>Number of table/object-level connection points (custom tables and objects carry additional cost)</li>
        <li>Direction (one-way vs bidirectional)</li>
        <li>Number of CRM users</li>
        <li>Required SYNC frequency</li>
      </ul>
      <div class="callout"><h4>Where partners get pricing</h4><p>Partners have access to the Quoting Tool inside the Partner Portal for ballpark estimates and can also reach out to their PAM when a deal is unusual or needs a sanity check. Final quotes always come from Commercient sales after your PAM connects you with a Commercient AE. There is no published "starts at" price — pricing is driven by the 6 variables listed above.</p></div>
    `,
    takeaways: [
      "Commercient is a platform; SYNC, AI, and Pulse all sit on the same data lake",
      "Three components, three figures on every integration quote (Annual Success Plan, Monthly SaaS, Success Plan)",
      "Six variables drive price; partners use the Quoting Tool for ballparks and the PAM for everything else"
    ]
  },
  {
    id: 2, group: "Platform & Selling",
    title: "Spotting an integration opportunity",
    time: "8 min",
    objectives: [
      "Recognize the language clients use when they need integration",
      "Know the minimum information needed to bring Commercient in",
      "Know the disqualifiers — what we don't do"
    ],
    body: `
      <p>Most integration opportunities surface in conversations that aren't about integration. Train your ear for these phrases:</p>
      <ul>
        <li>"We can't see ERP data in our CRM."</li>
        <li>"Our reps can't tell what was paid or shipped."</li>
        <li>"Finance and sales are using different numbers."</li>
        <li>"We're moving from QuickBooks to a real ERP." (or vice versa)</li>
        <li>"Their HubSpot Sales Hub is going live but the back office isn't connected."</li>
      </ul>
      <p>Every one of those is an integration opportunity in plain language. When you hear one, the intake your Commercient rep needs from you is short and you can collect it in any client conversation.</p>
      <h3>The minimum intake</h3>
      <ul>
        <li>ERP and version</li>
        <li>CRM and version</li>
        <li>Direction (ERP → CRM, CRM → ERP, or bidirectional)</li>
        <li>User count (CRM seats)</li>
        <li>Key data objects in scope (accounts, orders, invoices, products, etc.)</li>
      </ul>
      <p>That's enough to scope the deal and produce a ballpark.</p>
      <h3>The disqualifiers — what we don't do</h3>
      <ul>
        <li><strong>No one-time imports or migrations.</strong> Recurring sync only.</li>
        <li><strong>No ERP-to-ERP integrations.</strong> We connect CRM ↔ ERP, eCommerce ↔ ERP, and similar — not ERP ↔ ERP.</li>
      </ul>
    `,
    takeaways: [
      "Listen for system-of-record disconnects in everyday client language",
      "Five fields of intake (ERP, CRM, direction, users, objects) is enough to bring us in",
      "Disqualifiers: no one-time jobs, no ERP-to-ERP"
    ]
  },
  {
    id: 3, group: "Platform & Selling",
    title: "Confirming Commercient supports the systems",
    time: "5 min",
    objectives: [
      "Verify Commercient supports a customer's system stack before scoping",
      "Know what to do when an integration isn't in the standardized catalog"
    ],
    body: `
      <p>Before you scope a deal, confirm Commercient connects to the systems the customer has. The fastest way: go to <a href="https://www.commercient.com" target="_blank" rel="noopener">www.commercient.com</a> and use the search in the top right.</p>
      <p>Type the systems you're trying to connect — for example, "givecampus sage" or "netsuite hubspot." The product results show every supported SYNC integration that matches.</p>
      <div class="callout"><h4>If the search returns no result</h4><p>That doesn't automatically mean we can't do it. Most often it means the integration isn't in the standardized SYNC catalog and the deal would be either Custom or Pulse. Email your PAM or partners@commercient.com to confirm.</p></div>
      <p>The integration finder is also available inside the Partner Portal under <strong>Pre-Sales Resources</strong>.</p>
    `,

    body: `
      <p>Every partner has access to the Commercient Partner Portal — a single dashboard where you submit leads, get instant quotes, track active deals, manage joint customers, access support tickets, and find integration documentation.</p>
      <p>Log in at <a href="https://portal.commercient.com" target="_blank" rel="noopener">portal.commercient.com</a> using your partner credentials. If you don't have access yet, email partners@commercient.com or contact your PAM.</p>
      <div class="callout"><h4>Practical homework for this module</h4><p>Complete the <a href="https://app.teamwalnut.com/player/?demoId=74497551-96e1-49af-8283-fcd9b9d98347&screenId=e51e4cc2-b3d5-41a0-bf3f-0058cd7297b4&showGuide=true&showGuidesToolbar=true&showHotspots=true&openGuidesToolbar=false&source=app" target="_blank" rel="noopener">Partner Portal click-through tutorial</a> — a full walkthrough of the dashboard.</p></div>
      <h3>The dashboard at a glance</h3>
      <p>The top of the dashboard shows your partnership metrics, cumulative across the lifetime of your relationship with Commercient:</p>
      <ul>
        <li><strong>Sourced Leads</strong> — commission-eligible referrals you've submitted</li>

      <p>CGI is one of the things that makes Commercient distinct, and one of the most important things a partner can introduce well. Customers who understand CGI before they sign walk into delivery confident, engaged, and ready to move quickly.</p>
      <h3>What CGI is</h3>
      <p>Commercient Guided Implementation is an avatar-led, interactive virtual environment where the customer configures their Commercient SYNC according to their purchased license. The customer's guide inside the environment is "Ruby." The experience is gamified — customers move through rooms, complete objectives, earn badges, and unlock the next step. A live human Customer Success team is reachable inside the environment in real time, so help is always one click away.</p>

      <h3>The delivery arc at a glance</h3>
      <p>After a customer signs, the implementation moves through the following steps in sequence:</p>
      <p class="flow">CGI (including Installation) → Phase 1 (ERP to CRM) → Phase 2 (CRM to ERP, if included) → Ongoing Success Plan</p>
      <p>Phase 1 and Phase 2 are distinct delivery projects. They run sequentially — Commercient recommends completing Phase 1 before beginning Phase 2, because the data foundation built in Phase 1 is what Phase 2 relies on. Each step has a defined team, a defined scope, and defined outcomes. Partners who understand this arc can set accurate expectations, help customers stay engaged, and avoid the confusion that stalls projects.</p>
      <h3>Commercient Guided Implementation (CGI)</h3>
      <p>As covered in Module 9, CGI is the interactive guided environment where customers complete onboarding after contract signing. One of the key steps the customer completes inside CGI is installation — connecting Commercient's infrastructure to their ERP system, supported live by Commercient's Installation team. The connection method depends on how the ERP is hosted:</p>
      <ul>
        <li><strong>SQL Sync:</strong> Used when the ERP data lives on a Microsoft SQL Server. The Installation team creates a dedicated SQL user, clones the relevant ERP tables to Commercient's cloud servers, and configures the sync agent on the customer's server.</li>
        <li><strong>ODBC Sync:</strong> Used for non-SQL ERPs or legacy systems. Requires an ODBC driver configured on the customer's server; the team sets up the driver connection and clones the tables from there.</li>
        <li><strong>API Sync:</strong> Used for cloud-based ERPs (NetSuite, Business Central, and similar). No software is installed on the customer's server — the connection is configured server-side by Commercient using the ERP's API and OAuth credentials.</li>
      </ul>
      <p>For on-premise ERPs, the customer's IT team needs to whitelist Commercient's IP addresses so the sync agent can communicate outbound. This is one of the most common sources of early delay — worth flagging with the customer during the sales conversation that IT needs to know it's coming. Once installation is complete and sample records are verified in the CRM, the Phase 1 Kickoff Meeting is scheduled and Phase 1 delivery begins.</p>
      <h3>Phase 1 — ERP to CRM</h3>
      <p>Phase 1 is the direction most customers know best: ERP data flowing into the CRM. Accounts, contacts, orders, invoices, pricing, inventory, payment history — the data your customer's sales team needs in one place. Phase 1 runs automatically on the sync schedule the customer purchased (typically twice per day, Monday through Friday). Once configured, it runs without manual intervention.</p>
      <h4 class="step-h">Step 1: Kickoff Meeting</h4>
      <p>A live meeting between the customer and the Phase 1 Team, where the contract is translated into a specific, actionable configuration. What gets confirmed:</p>

        <li>Whether sales rep ownership assignment is needed</li>
      </ul>
      <p>The kickoff also includes a table review — the team walks the customer through the ERP tables cloned to Commercient's cloud, confirms record counts match expectations, and flags anything missing before work begins.</p>
      <div class="callout"><h4>Partner's role at kickoff</h4><p>If you're included in the project (via TPAF or the original contract), attending the kickoff is valuable. You'll hear how the customer describes their data, which often surfaces scope questions or CRM configuration needs that fall to you. You can also help the customer come prepared — knowing their sync frequency preference, having ERP credentials ready, and an IT contact available for whitelisting.</p></div>
      <h4 class="step-h">Step 2: Account and Product Matching</h4>
      <p>If the CRM already has existing account records when Phase 1 begins, a matching process links existing CRM accounts to their corresponding ERP customers using a unique key — <strong>ARCustomerCode</strong> (on Account records) or <strong>ExternalKey</strong> (on all other objects like Contacts and Products). Without matching, the sync can't tell whether an incoming ERP account already exists in the CRM — the result is duplicate records.</p>
      <p>The Phase 1 Team runs the matching tool, exports the results to a spreadsheet, and sends it to the customer before the matching meeting. The export breaks into four categories: Matched, Duplicates, Unmatched CRM, and Unmatched ERP. In the matching meeting, the team walks the customer through the tool and helps review results. The customer owns their data and must confirm or correct the matches — Commercient facilitates and provides the tooling.</p>

        <li>If matching takes time, the engineer can use a small set of confirmed matches (as few as 5–10 records) to begin sync configuration while the customer continues.</li>

      <div class="callout"><h4>Partner's role in matching</h4><p>Data cleanup is squarely in partner territory. Helping a customer clean messy CRM data — duplicates, inconsistent naming, missing fields — before or during matching directly accelerates the project and prevents rework. One of the most common places partners add visible value during delivery.</p></div>
      <h4 class="step-h">Step 3: Core Sync and Add-On Sync</h4>
      <p>The core sync is the foundation of Phase 1: Customers (accounts), Addresses, Contacts, Salespersons, Sales Order Headers, Sales Order Detail Lines, Invoice Headers, and Invoice Detail Lines — the objects that make up the standard integration for most customers. After the core objects are configured and validated, the sync is enabled and records begin flowing on schedule.</p>
      <p>Add-ons are any additional objects beyond the core — products, price lists, inventory levels, payment history, documents, RMAs, custom tables, and similar — configured after the core sync is stable. Larger scopes mean more add-ons, one of the main reasons timelines vary. Data flows at scheduled intervals (not real time unless purchased). Records are upserted: new ERP records create new CRM records; updated ERP records update the matching CRM record. Once synced, a record only syncs again when a mapped field changes in the ERP.</p>
      <h4 class="step-h">Step 4: Layout Training</h4>
      <p>A live session where the Phase 1 Team walks the customer through what they can see and do in the CRM with their synced data, and covers the Customer Panel — Commercient's customer-facing portal for managing their sync. It covers how accounts relate to synced objects, how the ARCustomerCode field works, how to add synced fields to CRM page layouts via formula fields, how product/item data is structured, and sales rep ownership assignment.</p>
      <p>The <strong>Customer Panel</strong> (registration.shop.commercient.com) gives customers direct visibility into their sync:</p>

      <h4 class="step-h">Step 5: Phase 1 Sign-Off</h4>
      <p>Phase 1 is delivered when the core sync is running, the data is verified (correct records, mapping, values), add-ons are configured and synced, and the customer is trained on their CRM layout and Customer Panel. Sign-off is confirmed through the customer's review and acknowledgment that the data looks correct. The Phase 1 Team monitors sync logs, resolves integration errors, and closes out open tasks. After sign-off, the CSM remains the ongoing point of contact; change requests, new tables, or scope additions go through the ticketing system.</p>
      <h3>Phase 2 — CRM to ERP</h3>
      <p>Phase 2 is the reverse direction: data originating in the CRM written back into the ERP. The most common use case is syncing a closed-won opportunity or a CRM quote into the ERP as an order. Phase 2 differs from Phase 1 in several important ways:</p>
      <ul>
        <li><strong>Phase 2 requires an API.</strong> Unlike Phase 1 (ODBC, SQL, or API), Phase 2 can only write into the ERP through the ERP's API. If there's no available API, the standard path isn't possible — a flat-file alternative may exist in some cases but requires additional assessment.</li>
        <li><strong>Phase 2 is not automatic.</strong> Commercient adds a <strong>Commercient Import</strong> checkbox to the relevant CRM object (e.g., Opportunity, Quote). When a user checks it — or a CRM workflow checks it automatically at a specific status — Commercient picks up that record on the next sync run and writes it into the ERP. Two auxiliary fields (<strong>Commercient Completed</strong> and <strong>Commercient Message</strong>) report whether the import succeeded or failed and what happened.</li>

      <h3>Who's involved during delivery</h3>
      <p>The <strong>CSM</strong> owns the customer relationship through the entire delivery — for status, escalations, or anything about progress, all roads run through the CSM. The <strong>Phase 1 Team</strong> handles ERP→CRM delivery (kickoff, matching, core sync, layout training, add-ons, sign-off). The <strong>Phase 2 Team</strong> handles CRM→ERP delivery (kickoff, configuration, live demo, UAT, sign-off) and can't start until Phase 1 is complete. Your <strong>PAM</strong> is the partner-side resource for coordination, visibility, and escalation across the whole engagement — if something feels stuck or misaligned, the PAM is the right first call.</p>

      <h3>The standard ranges</h3>
      <ul>

      <h3>What lands a project at the fast end</h3>
      <ul>
        <li>Customer completes CGI promptly and provides credentials and access on day one</li>
        <li>ERP and CRM instances are standard, supported versions (not heavily customized or hosted by a restricted provider)</li>
        <li>Direction and objects are within the standardized SYNC scope — no custom fields, no non-standard objects</li>

      <h3>What lands a project at the slow end</h3>
      <p><strong>Customer skips or delays CGI.</strong> CGI is the self-service registration process every new customer completes before installation can begin. Until CGI is done, nothing else starts. A customer who sits on it for weeks sits on the clock.</p>
      <p><strong>Custom scope.</strong> Non-standard objects, custom ERP fields, ERP-to-ERP attempts (which Commercient does not do), and legacy or unusual ERP versions all require custom development outside the standard SYNC catalog — scoped and priced separately, and takes longer.</p>
      <p><strong>ERP or CRM access issues.</strong> One of the most common and least understood delay drivers:</p>
      <ul>
        <li><strong>IP whitelisting delays.</strong> The customer's IT team must whitelist Commercient's IP addresses so the SYNC agent can communicate with their server or ERP environment.</li>
        <li><strong>OAuth credential issues.</strong> Cloud ERPs/CRMs connect via API using OAuth and require valid admin credentials. Wrong, expired, deactivated, or mis-scoped credentials cause the connection to fail.</li>
        <li><strong>Sandbox vs. production confusion.</strong> Confirm — in writing — which environment SYNC is built on and what the handoff to production looks like, during or before CGI, not during implementation.</li>
        <li><strong>Right Networks / Rightworks hosting.</strong> If a customer's ERP (commonly QuickBooks) is hosted by Rightworks or a similar hosted desktop provider, the API is typically blocked. Identify this before contract signing.</li>
      </ul>
      <p><strong>Source data quality problems.</strong> Commercient maps data; it does not clean it. Dirty source data makes mapping take longer and is the customer's responsibility (see Module 11).</p>
      <p><strong>Scope changes mid-project.</strong> Adding objects or changing direction after start requires a re-quote and resets the relevant timeline.</p>

  <script>
/* Commercient Academy — app logic
   Multi-course: academy home (catalog) → course → module/quiz/certificate.
   Progress is stored per-course under cpa_progress_v2 and migrates v1. */
(function(){
  const LS_KEY = "cpa_progress_v2";
  const LS_LEGACY = "cpa_progress_v1";
  let progress = load();

  function blankCourse(){ return {done:{}, quiz:null, reg:null, emailed:false}; }
  function load(){
    try{
      const v2 = JSON.parse(localStorage.getItem(LS_KEY));
      if(v2 && v2.courses) return v2;
    }catch(e){}
    // migrate the single-course v1 blob into the platform course
    const p = {courses:{}};
    try{
      const v1 = JSON.parse(localStorage.getItem(LS_LEGACY));
      if(v1) p.courses.platform = {done:v1.done||{}, quiz:v1.quiz||null, reg:v1.reg||null, emailed:!!v1.emailed};
    }catch(e){}
    return p;
  }
  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(progress)); }catch(e){} }
  function cs(id){ if(!progress.courses[id]) progress.courses[id]=blankCourse(); return progress.courses[id]; }

  /* ---------- Course helpers ---------- */
  const courseById = id => COURSES.find(c=>c.id===id);
  let cur = null;          // current course object
  let order = [];          // [moduleId..., 'quiz'] for current course

  function setCourse(id){
    cur = courseById(id) || COURSES[0];
    order = [];
    cur.groups && cur.groups.forEach(g=>g.modules.forEach(m=>order.push(m)));
  }
  function moduleById(mid){ return cur.modules.find(m=>m.id===mid); }
  function totalUnits(){ return cur.modules.length + 1; }
  function st(){ return cs(cur.id); }
  function completedCount(){
    const s = st();
    return cur.modules.filter(m=>s.done[m.id]).length + (s.quiz && s.quiz.passed ? 1 : 0);
  }
  function coursePct(c){
    const s = cs(c.id);
    if(c.status!=='available') return 0;
    const total = c.modules.length + 1;
    const done = c.modules.filter(m=>s.done[m.id]).length + (s.quiz && s.quiz.passed ? 1 : 0);
    return Math.round(done/total*100);
  }
  function isCertified(c){ const s=cs(c.id); return !!(s.quiz && s.quiz.passed); }

  function goName(item){ return item==='quiz' ? 'quiz' : 'm:'+item; }
  function nextItem(id){ const i=order.indexOf(id); return i>=0 && i<order.length-1 ? order[i+1] : null; }
  function prevItem(id){ const i=order.indexOf(id); return i>0 ? order[i-1] : null; }

  const main = document.getElementById('main');
  const sb = document.getElementById('sidebar');

  /* ---------- Sidebar ---------- */
  function renderSidebarHome(){
    let html = `<div class="sb-title">${ACADEMY.name}</div>
      <div class="sb-tag">Commercial AI, certified.</div>

  function renderSidebarCourse(active){
    const pct = Math.round(completedCount()/totalUnits()*100);
    let html = `<div class="sb-crumb" data-go="home">&larr; All courses</div>

      html += `<div class="sb-group"><h4>${g.name}</h4>`;

  /* ---------- Module reader ---------- */
  function renderModule(id){
    const m = moduleById(id);
    if(!m) return renderCourse();
    const s = st();
    const prev = prevItem(id);
    const next = nextItem(id);
    const prevIsModule = typeof prev === 'number';
    const done = !!s.done[id];
    const nextLabel = next==='quiz' ? 'Go to quiz &rarr;' : (next ? `Module ${next} &rarr;` : '');
    main.innerHTML = `
      <div class="reader">
        <div class="hero sm">
          <p class="eyebrow">Module ${m.id} &middot; ${m.group}</p>
          <h1>${m.title}</h1>

        <div class="reader-body">${m.body}</div>
        <div class="takeaways"><h4>Key takeaways</h4><ul>${m.takeaways.map(t=>`<li>${t}</li>`).join('')}</ul></div>
        <div class="pager">
          ${prevIsModule?`<button class="cta ghost" data-go="m:${prev}">&larr; Module ${prev}</button>`:`<span></span>`}
          <button class="cta" id="markBtn">${done?'&#10003; Completed — Continue':'Mark complete &amp; continue'}</button>

  /* ---------- Quiz ---------- */
  function renderQuiz(){
    const s = st();
    if(!s.reg) return renderRegForm();
    const QUIZ = cur.quiz;
    let lastSec = -1, html = '';
    QUIZ.questions.forEach((q,i)=>{
      if(q.s!==lastSec){ html += `<div class="qsec-head">${QUIZ.sections[q.s]}</div>`; lastSec=q.s; }
      html += `<div class="q-block" data-q="${i}"><p class="qn"><span>${i+1}.</span>${q.q}</p>`;
      q.a.forEach((opt,j)=>{
        html += `<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>${opt}</span></label>`;
      });
      html += `</div>`;
    });
    const total = QUIZ.questions.length, passN = Math.ceil(QUIZ.passMark*total);
    main.innerHTML = `
      <div class="page">
      <div class="quiz-intro">
        <div class="hero sm"><p class="eyebrow">${cur.title}</p><h1>${total}-Question Certification Quiz</h1>
        <span class="est">Pass mark: ${Math.round(QUIZ.passMark*100)}% (${passN} / ${total})</span></div>
        <p class="lead" style="margin-top:20px">Taking this as <strong>${s.reg.first} ${s.reg.last}</strong> (${s.reg.company}). Answer all ${total} questions, then submit. Passing earns your <strong>${cur.badge.name}</strong> badge and certificate.</p>
      </div>
      ${html}
      <div class="scorebar no-print">
        <button class="cta" id="submitQuiz">Submit quiz</button>
        <span class="res" id="quizRes"></span>
        <div class="spacer"></div>
        <button class="cta ghost" id="resetQuiz">Reset answers</button>
      </div>
      </div>`;
    document.getElementById('submitQuiz').addEventListener('click',gradeQuiz);
    document.getElementById('resetQuiz').addEventListener('click',()=>renderQuiz());
    bindGo(); renderSidebarCourse('quiz'); window.scrollTo(0,0);
  }
  function gradeQuiz(){
    const s = st(); const QUIZ = cur.quiz;
    let correct=0, unanswered=0;
    QUIZ.questions.forEach((q,i)=>{
      const block = main.querySelector(`[data-q="${i}"]`);
      const sel = block.querySelector(`input[name="q${i}"]:checked`);
      block.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
      if(!sel){ unanswered++; }
      const chosen = sel ? parseInt(sel.value) : -1;
      const opts = block.querySelectorAll('.opt');
      opts[q.c].classList.add('correct');
      if(chosen===q.c) correct++;
      else if(chosen>=0) opts[chosen].classList.add('wrong');
    });
    const total = QUIZ.questions.length;
    const pct = correct/total;
    const passed = pct>=QUIZ.passMark;
    const res = document.getElementById('quizRes');
    res.textContent = `${correct}/${total} correct (${Math.round(pct*100)}%)${unanswered?` · ${unanswered} unanswered`:''} — ${passed?'PASS':'not yet'}`;
    res.className = 'res ' + (passed?'pass':'fail');
    const prevPassed = s.quiz && s.quiz.passed;
    s.quiz = {passed, score:correct, total, when: (prevPassed && s.quiz.when) ? s.quiz.when : Date.now()};
    if(!passed) s.emailed = false;
    save();
    renderSidebarCourse('quiz');
    if(passed && !document.getElementById('toCert')){
      const b = document.createElement('button');
      b.className='cta'; b.id='toCert'; b.textContent='🏅 Claim your badge →';
      b.addEventListener('click',()=>route('cert'));
      document.querySelector('.scorebar').appendChild(b);
    }
    main.querySelector('.scorebar').scrollIntoView({behavior:'smooth',block:'center'});
  }

  /* ---------- Certificate + badge + share ---------- */
  function fmt(d){ return d.toLocaleString('en-US',{year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}); }
  function fmtDate(d){ return d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}); }

  function emailCertificate(reg, score, total, issuedStr, expStr){
    const subject = `${cur.title} — Certificate of Completion`;
    const body =
`Hi ${reg.first},

Congratulations on completing the ${cur.title} at ${ACADEMY.name}.

You've earned the "${cur.badge.name}" badge.

Name: ${reg.first} ${reg.last}
Organization: ${reg.company}
Email: ${reg.email}
Score: ${score}/${total}
Issued: ${issuedStr}
Valid through: ${expStr}

A copy of this certificate has been forwarded to partners@commercient.com (cc'd on this email). You can also download it and add the credential to LinkedIn from ${ACADEMY.name}.

— ${ACADEMY.name}`;
    const href = `mailto:${encodeURIComponent(reg.email)}?cc=${encodeURIComponent('partners@commercient.com')}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    const a = document.createElement('a');
    a.href = href; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function linkedInAddUrl(issued){
    // LinkedIn "Add to profile" certification flow
    const p = new URLSearchParams({
      startTask: 'CERTIFICATION_NAME',
      name: cur.title,
      organizationName: 'Commercient',
      issueYear: String(issued.getFullYear()),
      issueMonth: String(issued.getMonth()+1)
    });
    return 'https://www.linkedin.com/profile/add?' + p.toString();
  }

          <div class="ttl">${ACADEMY.name}</div>
          <h2>Certificate of Completion</h2>
          <p class="body">This certifies that</p>
          <div class="name">${reg.first} ${reg.last}</div>
          <p class="body">of <strong>${reg.company}</strong> has successfully completed the <strong>${cur.title}</strong> and earned the <strong>${cur.badge.name}</strong> credential, passing the certification quiz with a score of ${s.quiz.score}/${total}.</p>
          <div class="cert-meta">
            <div><span>Name</span>${reg.first} ${reg.last}</div>
            <div><span>Organization</span>${reg.company}</div>
            <div><span>Email</span>${reg.email}</div>
            <div><span>Credential</span>${cur.badge.name}</div>
            <div><span>Issued</span>${issuedStr}</div>
            <div><span>Valid through</span>${expStr}</div>
          </div>
        </div>
      </div>`;
    document.getElementById('printCert').addEventListener('click',()=>window.print());
    document.getElementById('resendCert').addEventListener('click',()=>{
      emailCertificate(reg, s.quiz.score, total, issuedStr, expStr);
    });
    document.getElementById('copyBrag').addEventListener('click',()=>{
      const note = document.getElementById('copyNote');
      const done = ()=>{ note.classList.remove('hide'); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(brag).then(done, done);
      }else{
        const ta=document.createElement('textarea'); ta.value=brag; document.body.appendChild(ta); ta.select();
        try{document.execCommand('copy');}catch(e){} ta.remove(); done();
      }
    });
    bindGo(); renderSidebarCourse('cert'); window.scrollTo(0,0);
  }

  /* ---------- Router ---------- */
  function route(go){
    if(!go || go==='home') return renderHome();
    if(go.indexOf('c:')===0){ setCourse(go.slice(2)); return renderCourse(); }
    if(go.indexOf('cert:')===0){ setCourse(go.slice(5)); return renderCert(); }
    if(go.indexOf('m:')===0){ if(!cur) setCourse(COURSES[0].id); return renderModule(parseInt(go.slice(2))); }
    if(go==='quiz'){ if(!cur) setCourse(COURSES[0].id); return renderQuiz(); }
    if(go==='cert'){ if(!cur) setCourse(COURSES[0].id); return renderCert(); }
    if(go==='overview') return cur ? renderCourse() : renderHome();
    renderHome();
  }
  function bindGo(){ main.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>route(el.dataset.go))); }
  document.querySelectorAll('.topnav [data-go]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();route(el.dataset.go);}));

  renderHome();
})();

</script>
